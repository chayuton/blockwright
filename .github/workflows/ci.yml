name: ทดสอบ

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: รันเกมตัวอย่างทั้งห้าแบบไม่เปิดเบราว์เซอร์
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
